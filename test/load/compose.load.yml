services:
  postgres:
    ports: !override
      - '25432:5432'
    command:
      - postgres
      - -c
      - shared_buffers=2GB
      - -c
      - effective_cache_size=4GB
      - -c
      - max_wal_size=8GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - wal_compression=lz4
  sqs:
    ports: !override
      - '24566:4566'

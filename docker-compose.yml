name: wagering-processor

x-app: &app
  build: .
  image: wagering-processor:local
  init: true
  stop_grace_period: 30s
  environment:
    DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
    AWS_ENDPOINT_URL: http://sqs:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    AUTH_ISSUER: http://localhost:8080/realms/wagering
    AUTH_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
    LOG_LEVEL: info

x-ready: &ready
  test:
    [
      'CMD',
      'wget',
      '-q',
      '-O',
      '/dev/null',
      'http://127.0.0.1:3000/health/ready',
    ]
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wagering -d wagering']
      interval: 2s
      timeout: 3s
      retries: 30

  sqs:
    image: ministackorg/ministack:1.5.20
    ports:
      - '4566:4566'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request as r; r.urlopen(''http://localhost:4566/_ministack/health'')" || exit 1',
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8080:8080'
    volumes:
      - ./keycloak/wagering-realm.json:/opt/keycloak/data/import/wagering-realm.json:ro
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && read -r line <&3 && [[ $$line == *" 200 "* ]]',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  bootstrap:
    <<: *app
    command: ['bun', 'src/main.bootstrap.ts']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
      sqs:
        condition: service_healthy

  api:
    <<: *app
    command: ['bun', 'src/main.api.ts']
    ports:
      - '3000:3000'
    healthcheck: *ready
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ['bun', 'src/main.worker.ts']
    healthcheck: *ready
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: ['observability']
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    ports:
      - '9090:9090'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      keycloak:
        condition: service_healthy
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:9090/-/ready',
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  grafana:
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    profiles: ['observability']
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/wagering.json
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    ports:
      - '3001:3000'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:3000/api/health',
        ]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  pgdata:
  prometheus-data:
  grafana-data:

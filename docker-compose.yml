name: wagering-processor

x-hardened: &hardened
  read_only: true
  cap_drop: ['ALL']
  security_opt: ['no-new-privileges:true']

x-app: &app
  <<: *hardened
  build: .
  image: wagering-processor:local
  init: true
  stop_grace_period: 30s
  tmpfs:
    - /tmp
  deploy:
    resources:
      limits:
        cpus: '1'
        memory: 512M
  environment:
    DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
    AWS_ENDPOINT_URL: http://sqs:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    AUTH_ISSUER: http://localhost:8080/realms/wagering
    AUTH_JWKS_URL: http://keycloak:8080/realms/wagering/protocol/openid-connect/certs
    LOG_LEVEL: info
    BUN_RUNTIME_TRANSPILER_CACHE_PATH: '0'

x-ready: &ready
  test:
    [
      'CMD',
      'wget',
      '-q',
      '-O',
      '/dev/null',
      'http://127.0.0.1:3000/health/ready',
    ]
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

services:
  postgres:
    <<: *hardened
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    cap_add: ['CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'SETGID', 'SETUID']
    tmpfs:
      - /var/run/postgresql
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 2G
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wagering -d wagering']
      interval: 2s
      timeout: 3s
      retries: 30

  sqs:
    <<: *hardened
    image: ministackorg/ministack:1.5.20@sha256:051edcb3daed7ca3bdfe06c3c5e1427473ba656e8211f8c1d342543b277e982d
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
    ports:
      - '4566:4566'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request as r; r.urlopen(''http://localhost:4566/_ministack/health'')" || exit 1',
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  keycloak-database:
    <<: *hardened
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: 'no'
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
    environment:
      PGHOST: postgres
      PGUSER: wagering
      PGPASSWORD: wagering
      PGDATABASE: wagering
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
    command:
      - sh
      - -c
      - |
        psql -v ON_ERROR_STOP=1 -v password="$$KEYCLOAK_DB_PASSWORD" <<'SQL'
        select format('create role keycloak login password %L', :'password')
          where not exists (select from pg_roles where rolname = 'keycloak') \gexec
        select 'create database keycloak owner keycloak'
          where not exists (select from pg_database where datname = 'keycloak') \gexec
        SQL
    depends_on:
      postgres:
        condition: service_healthy

  keycloak:
    <<: *hardened
    build: ./keycloak
    image: wagering-keycloak:local
    command: ['start', '--optimized', '--import-realm']
    tmpfs:
      - /opt/keycloak/data:uid=1000,gid=0,mode=0770
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1536M
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_HTTP_ENABLED: 'true'
    ports:
      - '8080:8080'
    volumes:
      - ./keycloak/wagering-realm.json:/opt/keycloak/data/import/wagering-realm.json:ro
    depends_on:
      keycloak-database:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/9000 && printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && read -r line <&3 && [[ $$line == *" 200 "* ]]',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  bootstrap:
    <<: *app
    command: ['bun', 'src/main.bootstrap.ts']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
      sqs:
        condition: service_healthy

  api:
    <<: *app
    command: ['bun', 'src/main.api.ts']
    ports:
      - '3000:3000'
    healthcheck: *ready
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ['bun', 'src/main.worker.ts']
    healthcheck: *ready
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  prometheus:
    <<: *hardened
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: ['observability']
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    ports:
      - '9090:9090'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      keycloak:
        condition: service_healthy
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:9090/-/ready',
        ]
      interval: 5s
      timeout: 3s
      retries: 12

  grafana:
    <<: *hardened
    image: grafana/grafana:13.2.3@sha256:b28bae15e219c998fb0e0424ed724930cc61b1f61fb404d47c862f9a23f9e572
    profiles: ['observability']
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/wagering.json
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    ports:
      - '3001:3000'
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          'http://127.0.0.1:3000/api/health',
        ]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  pgdata:
  prometheus-data:
  grafana-data:

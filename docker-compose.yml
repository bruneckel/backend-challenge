name: wagering-processor

x-app: &app
  build: .
  image: wagering-processor:local
  init: true
  stop_grace_period: 30s
  environment:
    DATABASE_URL: postgresql://wagering:wagering@postgres:5432/wagering
    AWS_ENDPOINT_URL: http://sqs:4566
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    LOG_LEVEL: info

x-ready: &ready
  test:
    [
      'CMD',
      'wget',
      '-q',
      '-O',
      '/dev/null',
      'http://127.0.0.1:3000/health/ready',
    ]
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wagering -d wagering']
      interval: 2s
      timeout: 3s
      retries: 30

  sqs:
    image: ministackorg/ministack:1.5.20
    ports:
      - '4566:4566'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request as r; r.urlopen(''http://localhost:4566/_ministack/health'')" || exit 1',
        ]
      interval: 2s
      timeout: 3s
      retries: 30

  bootstrap:
    <<: *app
    command: ['bun', 'src/main.bootstrap.ts']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
      sqs:
        condition: service_healthy

  api:
    <<: *app
    command: ['bun', 'src/main.api.ts']
    ports:
      - '3000:3000'
    healthcheck: *ready
    depends_on:
      bootstrap:
        condition: service_completed_successfully

  worker:
    <<: *app
    command: ['bun', 'src/main.worker.ts']
    healthcheck: *ready
    depends_on:
      bootstrap:
        condition: service_completed_successfully

volumes:
  pgdata:
